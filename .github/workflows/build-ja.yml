name: Build Flarial JA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Fix dependencies and workarounds
        shell: pwsh
        run: |
          $content = Get-Content CMakeLists.txt -Raw
          $updated = [regex]::Replace(
            $content,
            '(?is)(fmt\b.*?)(?:GIT_TAG\s+|TAG\s+|VERSION\s+)master\b',
            '${1}GIT_TAG main'
          )
          if ($updated -eq $content) {
            $lines = Get-Content CMakeLists.txt
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '\bfmt\b') {
                $start = [Math]::Max(0, $i - 2)
                $end = [Math]::Min($lines.Count - 1, $i + 6)
                for ($j = $start; $j -le $end; $j++) {
                  if ($lines[$j] -match '\bmaster\b') {
                    $lines[$j] = $lines[$j] -replace '\bmaster\b', 'main'
                  }
                }
              }
            }
            $updated = ($lines -join "`n") + "`n"
          }

          $updated = $updated -replace 'https://github\.com/EclipseMenu/discord-presence(?:\.git)?', 'https://git.eclipse.menu/EclipseMenu/discord-presence.git'
          $updated = $updated -replace 'https://github\.com/EclipseMenu/rift(?:\.git)?', 'https://git.eclipse.menu/EclipseMenu/rift.git'
          $updated = [regex]::Replace($updated, '(?im)UNITY_BUILD\s+ON', 'UNITY_BUILD OFF')
          $updated = [regex]::Replace($updated, '(?im)set\s*\(\s*CMAKE_UNITY_BUILD\s+ON\b', 'set(CMAKE_UNITY_BUILD OFF')

          $targetHook = @(
            'if(TARGET Flarial)',
            '  set_target_properties(Flarial PROPERTIES UNITY_BUILD OFF)',
            '  if(EXISTS "${CMAKE_CURRENT_SOURCE_DIR}/src/Scripting/Script.cpp")',
            '    set_source_files_properties("${CMAKE_CURRENT_SOURCE_DIR}/src/Scripting/Script.cpp" PROPERTIES COMPILE_FLAGS "/Od")',
            '  endif()',
            'endif()'
          ) -join "`n"

          if ($updated -match '(?m)^(target_link_libraries\s*\(\s*Flarial\b)') {
            $updated = [regex]::Replace($updated, '(?m)^(target_link_libraries\s*\(\s*Flarial\b)', ($targetHook + "`n" + '$1'), 1) } else { $updated += "`n" + $targetHook + "`n" }  Set-Content CMakeLists.txt -Value $updated -NoNewline  $netLibPath = "src/Scripting/ScriptLibs/NetworkLib.hpp" if (Test-Path $netLibPath) { Write-Host "=== NetworkLib.hpp around lines 35-105 ===" $netLines = Get-Content $netLibPath for ($i = 34; $i -lt [Math]::Min($netLines.Count, 105); $i++) { Write-Host ("{0,3}: {1}" -f ($i + 1), $netLines[$i]) }  $netContent = Get-Content $netLibPath -Raw if ($netContent -notmatch '#include <functional>') { $netContent = "#include <functional>`n" + $netContent } $netUpdated = [regex]::Replace($netContent, '(?s)(addFunction\s*(?:<[^>]*>)?\s*\(\s*[^,]+,\s*)(\[.*?\]\s*\([^\)]*\)\s*(?:mutable\s*)?(?:->\s*[^\{]+)?\s*\{.*?\})(\s*\))',
              '${1}std::function(${2})${3}'
            )
            Set-Content $netLibPath -Value$netUpdated -NoNewline
          }

      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_UNITY_BUILD=OFF -DCMAKE_CXX_FLAGS="/EHsc /bigobj /WX-"

      - name: Build
        shell: cmd
        run: cmake --build build --config Release

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/Lang | Out-Null
          Copy-Item build/Flarial.dll out/
          Copy-Item Lang/ja.json out/Lang/
          if (Test-Path build/Flarial.pdb) { Copy-Item build/Flarial.pdb out/ }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Flarial_JA
          path: out/
