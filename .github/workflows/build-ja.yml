name: Build Flarial JA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Fix dependencies and build options
        shell: pwsh
        run: |
          $content = Get-Content CMakeLists.txt -Raw
          $updated = [regex]::Replace(
            $content,
            '(?is)(fmt\b.*?)(?:GIT_TAG\s+|TAG\s+|VERSION\s+)master\b',
            '${1}GIT_TAG main'
          )
          if ($updated -eq $content) {
            $lines = Get-Content CMakeLists.txt
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '\bfmt\b') {
                $start = [Math]::Max(0, $i - 2)
                $end = [Math]::Min($lines.Count - 1, $i + 6)
                for ($j = $start; $j -le $end; $j++) {
                  if ($lines[$j] -match '\bmaster\b') {
                    $lines[$j] = $lines[$j] -replace '\bmaster\b', 'main'
                  }
                }
              }
            }
            $updated = ($lines -join "`n") + "`n"
          }

          $updated = $updated -replace 'https://github\.com/EclipseMenu/discord-presence(?:\.git)?', 'https://git.eclipse.menu/EclipseMenu/discord-presence.git'
          $updated = $updated -replace 'https://github\.com/EclipseMenu/rift(?:\.git)?', 'https://git.eclipse.menu/EclipseMenu/rift.git'

          if ($updated -match 'target_link_libraries\s*\(\s*Flarial\b') {
            $updated = [regex]::Replace(
              $updated,
              '(target_link_libraries\s*\(\s*Flarial\b)',
              "set_target_properties(Flarial PROPERTIES UNITY_BUILD OFF)`n`$1",
              1
            )
          } else {
            $updated += "`nif(TARGET Flarial)`n  set_target_properties(Flarial PROPERTIES UNITY_BUILD OFF)`nendif()`n"
          }

          Set-Content CMakeLists.txt -Value $updated -NoNewline

      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_UNITY_BUILD=OFF -DCMAKE_CXX_FLAGS="/EHsc /bigobj /WX-"

      - name: Build
        shell: cmd
        run: cmake --build build --config Release

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/Lang | Out-Null
          Copy-Item build/Flarial.dll out/
          Copy-Item Lang/ja.json out/Lang/
          if (Test-Path build/Flarial.pdb) { Copy-Item build/Flarial.pdb out/ }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Flarial_JA
          path: out/
